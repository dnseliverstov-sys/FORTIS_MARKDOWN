name: Сборка приложения

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac
          - os: windows-latest
            name: Windows
            args: --win
          - os: ubuntu-latest
            name: Linux
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Собрать
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Приложение не подписано: сертификатов разработчика нет, и
          # electron-builder не должен пытаться подписывать сборку.
          # Ad-hoc подпись для macOS ставит хук scripts/adhoc-sign.js.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: fortis-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Релиз
    # Отдельной задачей, а не в каждой сборке: иначе три задачи создавали бы
    # один и тот же релиз одновременно и мешали друг другу.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Показать, что собралось
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Настольный markdown-редактор FORTIS.

            Приложение не подписано сертификатом разработчика, поэтому при
            первом запуске система предупредит о неизвестном источнике.
            Что с этим делать — в разделе «Готовые сборки» файла README.

            | Система | Какой файл брать |
            | --- | --- |
            | macOS, Apple Silicon | `...-arm64.dmg` |
            | macOS, Intel | `...-1.0.0.dmg` (без arm64 в названии) |
            | Windows | `...Setup...exe` — установщик, либо второй `.exe` без установки |
            | Linux | `.AppImage` для запуска без установки или `.deb` для Ubuntu и Debian |
